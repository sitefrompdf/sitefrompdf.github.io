<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>नई साइट पर जाएँ - sitefrompdf</title>
  <meta name="description" content="sitefrompdf की साइट अब नए पते siteformspdf.in पर है। Tour TA, Transfer TA, LTC, CEA फ़ॉर्म वहीं भरें।" />
  <link rel="canonical" href="https://siteformspdf.in/" />
  <meta name="theme-color" content="#1b5e20" />
  <noscript><meta http-equiv="refresh" content="5;url=https://siteformspdf.in/" /></noscript>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f8f9fa; color: #212529; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: linear-gradient(135deg, #1b5e20, #2e7d32); color: #fff; padding: 16px 20px; font-size: 20px; font-weight: 700; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 15px; }
    .card { background: #fff; border: 1px solid #e9ecef; border-left: 5px solid #4caf50; border-radius: 12px; padding: 26px 22px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .icon { font-size: 44px; margin-bottom: 10px; }
    h1 { font-size: 22px; color: #1b5e20; margin-bottom: 10px; }
    p { font-size: 15px; line-height: 1.6; color: #495057; margin-bottom: 14px; }
    .btn { display: inline-block; background: #1b5e20; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; padding: 13px 26px; border-radius: 28px; margin: 6px 0 14px; }
    .url { font-weight: 700; color: #1b5e20; word-break: break-all; }
    .note { font-size: 13px; color: #6c757d; margin: 0; }
    footer { text-align: center; padding: 16px; background: #1a1a1a; color: #aaa; font-size: 13px; }
  </style>
</head>
<body>
  <header>📋 sitefrompdf</header>
  <main>
    <div class="card">
      <div class="icon">📢</div>
      <h1>हमारी साइट नए पते पर आ गई है</h1>
      <p>Tour TA, Transfer TA, LTC, CEA और Form No. 3 अब यहाँ उपलब्ध हैं:</p>
      <p class="url">siteformspdf.in</p>
      <a id="goBtn" class="btn" href="https://siteformspdf.in/">नई साइट खोलें ➔</a>
      <p class="note" id="countdownNote">कुछ सेकंड में आप अपने-आप वहीं पहुँच जाएँगे।</p>
    </div>
  </main>
  <footer>© 2026 sitefrompdf</footer>

  <script>
    // पुराना पेज (जैसे /tour-ta.html) खोला हो तो नई साइट पर उसी पेज पर भेजें, वरना होम पेज पर
    (function () {
      var NEW_ORIGIN = 'https://siteformspdf.in';
      var path = location.pathname;
      if (path === '/index.html') path = '/';
      var target = NEW_ORIGIN + path + location.search + location.hash;
      document.getElementById('goBtn').href = target;
      var left = 5;
      var note = document.getElementById('countdownNote');
      var timer = setInterval(function () {
        left--;
        if (left <= 0) {
          clearInterval(timer);
          location.replace(target);
        } else {
          note.textContent = left + ' सेकंड में आप अपने-आप नई साइट पर पहुँच जाएँगे।';
        }
      }, 1000);
      note.textContent = left + ' सेकंड में आप अपने-आप नई साइट पर पहुँच जाएँगे।';
    })();
  </script>
</body>
</html>
